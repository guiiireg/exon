name: Prettier check

on:
  push:
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Prettier
        run: npm install --no-save prettier@latest

      - name: Check formatting
        run: npx prettier --check .
